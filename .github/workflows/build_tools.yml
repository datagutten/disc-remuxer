name: Build video libraries for windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_tools:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - tool: 'libaacs'
          repo: 'Windows-Media-Tools/libaacs'
        - tool: 'libbdplus'
          repo: 'ShiftMediaProject/libbdplus'
        - tool: 'libbluray'
          repo: 'ShiftMediaProject/libbluray'
        - tool: 'libdvdread'
          repo: 'ShiftMediaProject/libdvdread'

    steps:

    - name: Checkout forked libgpg-error
      uses: actions/checkout@v5
      with:
        repository: Windows-Media-Tools/libgpg-error
        path: ../libgpg-error

    - name: Checkout tool
      uses: actions/checkout@v5
      with:
        repository: ${{ matrix.repo }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3 # Action to set up MSBuild environment

    - name: Get dependencies
      run: SMP/project_get_dependencies.bat
      if: matrix.tool != 'libdvdread'

    - name: Build dependencies
      run: msbuild 'SMP/${{ matrix.tool }}_deps.sln' /p:configuration=ReleaseDLL /p:platform=x64
      if: matrix.tool != 'libdvdread'

    - name: Build libaacs
      run: msbuild 'SMP/${{ matrix.tool }}.sln' /p:configuration=ReleaseDLL /p:platform=x64

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.tool }}
        path: D:\a\msvc # ${{ github.workspace }}/../../msvc
