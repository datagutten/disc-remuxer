name: Build custom FFmpeg for windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_ffmpeg:
    runs-on: windows-2025
    steps:

    - name: Download FFVS-Project-Generator
      run: Invoke-WebRequest -Uri https://github.com/ShiftMediaProject/FFVS-Project-Generator/releases/download/1.12.0/FFVS-Project-Generator_1.12.0_x64.zip -OutFile FFVS-Project-Generator.zip

    - name: Unpack FFVS-Project-Generator
      run: Expand-Archive -Path FFVS-Project-Generator.zip -DestinationPath FFVS-Project-Generator

    - name: Checkout FFmpeg
      uses: actions/checkout@v5
      with:
        repository: ShiftMediaProject/FFmpeg

    - name: Checkout FFVS-Project-Generator
      if: matrix.tool == 'ffmpeg'
      uses: actions/checkout@v5
      with:
        repository: ShiftMediaProject/${{ matrix.tool }}

    - name: Generate FFmpeg project
      if: matrix.tool == 'ffmpeg'
      run: project_generate --enable-gpl --enable-version3 --enable-libbluray --enable-libdvdnav --enable-libdvdread  --disable-nvdec --disable-nvenc
      working-directory: FFVS-Project-Generator

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2 # Action to set up MSBuild environment

    - name: Get dependencies
      run: SMP/project_get_dependencies.bat

    - name: Build dependencies
      run: msbuild 'SMP/ffmpeg_deps.sln' /p:configuration=Release /p:platform=x64

    - name: Build FFmpeg
      run: msbuild 'SMP/ffmpeg.sln' /p:configuration=Release /p:platform=x64

    - uses: actions/upload-artifact@v4
      with:
        name: ffmpeg
        path: D:\a\msvc # ${{ github.workspace }}/../../msvc
