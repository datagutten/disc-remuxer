name: Build pydvdread wheels for Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_pydvdread:
    name: Build pydvdread
    runs-on: windows-latest

    steps:
    - name: Get latest libdvdread build
      uses: pozetroninc/github-action-get-latest-release@master
      with:
        owner: ShiftMediaProject
        repo: libdvdread

    - name: Checkout pydvdread
      uses: actions/checkout@v5
      with:
        repository: noah1510/PyDvdRead
        path: pydvdread

    - name: Download libvdread
      run: Invoke-WebRequest -Uri https://github.com/ShiftMediaProject/libdvdread/releases/download/6.1.3-1/libdvdread_6.1.3-1_msvc17.zip -OutFile libdvdread.zip

    - name: Unpack libdvdread
      run: Expand-Archive -Path libdvdread.zip -DestinationPath pydvdread\libdvdread

    - name: Checkout config
      uses: actions/checkout@v5
      with:
        sparse-checkout: |
          pydvdread_build/setup.py
          pydvdread_build/config.h
          pydvdread_build/version.h
        sparse-checkout-cone-mode: false
        path: disc-remuxer

    - name: Move files
      shell: bash
      run: | 
        mv disc-remuxer/pydvdread_build/setup.py pydvdread
        mv disc-remuxer/pydvdread_build/config.h pydvdread/libdvdread/include
        mv disc-remuxer/pydvdread_build/version.h pydvdread/libdvdread/include

    - name: Set up Python
      uses: actions/setup-python@v6

    - name: Install setuptools
      run: pip3 install -U setuptools delvewheel

    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse

    - uses: actions/upload-artifact@v6
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
