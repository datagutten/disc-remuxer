name: Build pydvdread wheels for Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_pydvdread:
    name: Build pydvdread
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
    - name: Get latest libdvdread build
      uses: pozetroninc/github-action-get-latest-release@master
      with:
        owner: ShiftMediaProject
        repo: libdvdread

    - name: Create folder
      run: md C:\build

    - name: Download libvdread
      run: Invoke-WebRequest -Uri https://github.com/ShiftMediaProject/libdvdread/releases/download/6.1.3-1/libdvdread_6.1.3-1_msvc17.zip -OutFile c:\build\libdvdread.zip

    - name: Unpack libdvdread
      run: Expand-Archive -Path c:\build\libdvdread.zip -DestinationPath c:\build\libdvdread

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install setuptools
      run: pip3 install -U setuptools

    - name: Checkout library
      uses: actions/checkout@v5
      with:
        repository: noah1510/PyDvdRead
        path: pydvdread

    - name: Setup dev cmd
      uses: ilammy/msvc-dev-cmd@v1

    - name: Copy files
      shell: bash
      run: |
        cd pydvdread
        mkdir /usr
        mv /build/libdvdread/include /usr/include 

    - name: Build Python wheel
      working-directory: c:\build\libdvdread
      run: python setup.py bdist_wheel

    - uses: actions/upload-artifact@v4
      with:
        name: pydvdread Python ${{ matrix.python-version }}
        path: c:\build\libdvdread

