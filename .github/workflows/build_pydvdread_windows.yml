name: Build pydvdread wheels for Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_pydvdread:
    name: Build pydvdread
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ #'3.10', '3.11', '3.12',
                          '3.13' ]

    steps:
    - name: Get latest libdvdread build
      uses: pozetroninc/github-action-get-latest-release@master
      with:
        owner: ShiftMediaProject
        repo: libdvdread

    - name: Create folder
      run: md C:\build

    - name: Checkout pydvdread
      uses: actions/checkout@v5
      with:
        repository: noah1510/PyDvdRead
        path: c:\build\pydvdread

    - name: Download libvdread
      run: Invoke-WebRequest -Uri https://github.com/ShiftMediaProject/libdvdread/releases/download/6.1.3-1/libdvdread_6.1.3-1_msvc17.zip -OutFile c:\build\libdvdread.zip

    - name: Unpack libdvdread
      run: Expand-Archive -Path c:\build\libdvdread.zip -DestinationPath c:\build\pydvdread\libdvdread

    - run: dir c:\build\pydvdread\libdvdread

    - name: Checkout setup.py
      uses: actions/checkout@v5
      with:
        sparse-checkout: |
          pydvdread_build/setup.py
        sparse-checkout-cone-mode: false
        path: c:\build\pydvdread\libdvdread


    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install setuptools
      run: pip3 install -U setuptools

    - name: Setup dev cmd
      uses: ilammy/msvc-dev-cmd@v1

    - run: pwd
      shell: bash

    - shell: bash
      run: ls -l /c/build/pydvdread

    - name: Build Python wheel
      working-directory: c:\build\pydvdread
      shell: bash
      run: python setup.py bdist_wheel

    - uses: actions/upload-artifact@v4
      with:
        name: pydvdread Python ${{ matrix.python-version }}
        path: c:\build\libdvdread

