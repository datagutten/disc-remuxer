name: build_pybluread.yml
on:
  push:
  workflow_dispatch:

jobs:
  build_pybluread:
    name: Build PyBluRead
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
    - name: Checkout PyBluRead
      uses: actions/checkout@v5
      with:
        repository: datagutten/PyBluRead

    - name: Download libbluray
      uses: dawidd6/action-download-artifact@v21
      with:
        workflow: build_tools.yml
        name: libbluray
        path: ${{ github.workspace }}/libbluray

    - name: Download libaacs
      uses: dawidd6/action-download-artifact@v21
      with:
        workflow: build_tools.yml
        name: libaacs
        path: ${{ github.workspace }}/libaacs

    - name: Display structure of downloaded files
      run: ls -R ${{ github.workspace }}/libbluray

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install setuptools
      run: pip3 install -U setuptools delvewheel

    - name: Build Python wheel
      shell: bash
      run: python setup.py bdist_wheel
      env:
        LIBBLURAY_INCLUDE_DIR: ${{ github.workspace }}\libbluray\include\\libbluray
        LIBBLURAY_LIBRARY_DIR: ${{ github.workspace }}\libbluray\lib\x64

    - name: Include dlls in wheel
      run: delvewheel repair dist/bluread*.whl --add-path "${{ github.workspace }}\libbluray\bin\x64" --add-path "${{ github.workspace }}\libaacs\bin\x64" --include aacs.dll
      shell: bash

    - uses: actions/upload-artifact@v7
      with:
        name: PyBluRead Python ${{ matrix.python-version }}
        path: dist

    - uses: actions/upload-artifact@v7
      with:
        path: wheelhouse
        archive: false
